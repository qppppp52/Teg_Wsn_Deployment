dqn:
  enabled: true
  mode: eval
  checkpoint_path: experiments/checkpoints/dqn_cr_mode_small_center_heat_best.pt
  network:
    hidden_dims: [128, 128]
  optimizer:
    learning_rate: 0.001
    gamma: 0.95
    batch_size: 32
    grad_clip_norm: 5.0
  replay:
    capacity: 20000
    min_size: 64
  target_update:
    interval: 100
  exploration:
    epsilon_start: 1.0
    epsilon_end: 0.05
    decay_steps: 6000
  training:
    updates_per_step: 1
    episodes: 120
    validation_interval: 5
    validation_patience: 20
  reward:
    clip: [-1.0, 1.0]
    normalize: true
    warmup_steps: 64
    pressure_regression_tolerance: 0.02
  state_normalization:
    enabled: true
    warmup_steps: 64
    clip: 5.0
    cv_total_ref: 20.0
  pressure_normalization:
    method: fixed_reference
    schema_version: dqn_cv6_fixed_reference_v1
    cv_zero_tol: 1.0e-12
    # Bootstrap values preserve the old explicit scale only for the next
    # training-pilot collection. Replace them with tool calibration output
    # before any formal DQN training or comparison.
    reference_source: migration_bootstrap_pending_pilot_calibration
    refs:
      deploy: 1.0
      link: 10.0
      power: 1.0
      service: 5.0
      sink: 10.0
      energy: 1.0
  action_mask:
    enabled: true
    thresholds:
      low_fr: 0.2
      feasible_fr: 0.8
      low_cv: 0.001
      high_pressure: 0.60
      dominant_margin: 0.05
      hv_stall_generations: 5
      small_delta_hv: 0.00001
  checkpoint:
    save_model: true
    strict_schema: true
    allow_legacy_checkpoint: false
