drl_init:
  enabled: true
  algorithm: ppo
  mode: train_then_generate
  seed: 42
  device: auto

  train_episodes: 1000
  max_steps_per_episode: 30
  rollout_steps: 512
  update_epochs: 8
  minibatch_size: 128
  gamma: 0.98
  gae_lambda: 0.95
  clip_epsilon: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  learning_rate: 3.0e-4
  max_grad_norm: 0.5

  population_size: 30
  drl_ratio: 0.6
  heuristic_ratio: 0.2
  random_ratio: 0.2
  allow_pure_drl: false

  max_selected_sensors: 10
  max_selected_aps: 2
  min_selected_sensors: 3
  min_selected_aps: 1
  allow_stop_action: true

  action_mode: sequential_node_role
  role_actions:
    - sensor
    - ap
    - skip
    - stop

  evaluate_during_training: true
  eval_interval_steps: 5
  terminal_full_evaluation: true
  use_repair_loop_for_reward: true
  max_repair_iter: 5

  reward:
    coverage: 0.25
    rsum: 0.25
    feasible_bonus: 0.30
    cv_penalty: 0.35
    repair_cost_penalty: 0.10
    diversity_bonus: 0.08
    invalid_action_penalty: 0.20
    too_few_nodes_penalty: 0.15
    duplicate_penalty: 0.10
    objective_drop_penalty: 0.10
    coverage_step: 0.10
    energy_step: 0.05
    link_step: 0.05
    sink_risk: 0.05

  normalization:
    rsum_ref_min: 0.0
    rsum_ref_max: 2.0e7
    cv_ref: 10.0
    repair_iter_ref: 5

  network:
    candidate_feature_dim: auto
    global_feature_dim: auto
    hidden_dim: 128
    attention_dim: 128
    use_attention: true
    use_candidate_encoder: true
    dropout: 0.1

  diversity:
    min_hamming_distance: 0.15
    min_priority_l2_distance: 0.05
    max_duplicate_retry: 30

  priority_noise_std: 0.03
  save_checkpoint: true
  load_checkpoint_if_exists: true
  force_retrain: false
  checkpoint_path: experiments/checkpoints/drl_init_policy.pt
  save_training_log: true
  save_generated_population: true


