drl_init:
  policy_type: sequential_reinforce
  train_episodes: 80
  generated_ratio: 0.7
  heuristic_ratio: 0.15
  random_ratio: 0.15
  placement_order: interleaved
  hidden_dims: [128, 128]
  lr: 3.0e-4
  entropy_coef: 0.01
  baseline_momentum: 0.9
  grad_clip: 1.0
  train_temperature: 1.0
  init_temperature: 0.4
  background_noise: 0.02
  noise: 0.05
  eval_repair_iter: 8
  reward:
    coverage_weight: 1.0
    throughput_weight: 0.35
    cv_penalty: 0.45
    feasible_bonus: 0.25
    cv_ref: 20.0
    throughput_ref: 1.0e8

