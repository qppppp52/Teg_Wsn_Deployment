ap:
  P_idle: 0.065
  P_proc: 0.028
  P_rx: 0.0045

sensor:
  P_sens: 0.014
  P_proc: 0.008

teg:
  model_type: thermal_resistance
  thermal_resistance:
    R_TEG: 0.12
    R_int: 0.8
    T_amb: 295.15
    eta: 0.60
    h_sink: 50.0
    sigma: 0.12

heatsink:
  neighbor_order: 1
  allow_node_node_overlap: false
  allow_self_node_sink_overlap: true
  allow_sink_on_other_node: false
  allow_sink_outside_neighborhood: false
  allow_sink_sink_overlap: false
  count_self_grid_as_sink: true

constraints:
  cv_schema_version: 3
  semantics_version: 3
  comparator_version: 2
  sink_classification_version: 2
  ownership_semantics_version: 2
  energy_tolerance_version: 2
  power_fallback_version: 1
  authoritative_fields_version: 1
  reward_metric_scaling_version: 1
  objective_semantics_version: 1
  feasible_tol: 1.0e-8
  cv_improvement_tol: 1.0e-6
  numeric_zero_tol: 1.0e-12
  power_abs_tol: 1.0e-10
  power_rel_tol: 1.0e-8
  energy_abs_tol: 1.0e-12
  energy_rel_tol: 1.0e-8
  energy_compare_tol: 1.0e-12
  cv_compare_tol: 1.0e-8
  max_ap_rebalance_moves: 3
  ap_service_enabled: true
  cv_normalization:
    enabled: true
  cv_weights:
    deploy: 0.1
    link: 0.1
    energy: 0.1
    sink: 0.1
    service: 0.1
    power: 0.1
  early_stop_if_cv_not_decrease: true
  max_repair_iter: 5
  cv_pressure_refs:
    deploy: 1.0
    link: 10.0
    power: 1.0
    energy: 1.0
    sink: 10.0
    service: 5.0
    total: 20.0

throughput_enhancement:
  enabled: true
  max_boost_steps: 96
